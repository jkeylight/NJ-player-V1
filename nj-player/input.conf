# ============================================================
#  NJ PLAYER — extra hotkeys
#  Preset keys (CTRL+0..3) and F9 cycling are defined in
#  scripts/nj-presets.lua
# ============================================================

# ------------------------------------------------------------
#  VIDEO QUALITY (bindings live in scripts/nj-quality.lua)
#   F2              picture menu — brightness / contrast /
#                   saturation / gamma, arrow keys + ENTER
#   F3              stream quality menu (web links only)
#   ALT+UP/DOWN     pick a picture parameter
#   ALT+LEFT/RIGHT  adjust it (+/- 5)
#   ALT+0           reset picture to neutral
#   ALT+B           toggle the NJ color boost
# ------------------------------------------------------------

# ------------------------------------------------------------
#  VLC-STYLE KEYS (same shortcuts as VLC's defaults)
#   v           next subtitle track
#   b           next audio track
#   a           cycle aspect ratio (Original/4:3/16:9/2.35:1)
#   n / p       next / previous in playlist  (p replaces
#               mpv's p=pause; SPACE still pauses)
#   t           show position bar + time
#   g / h       subtitle delay -0.5s / +0.5s
#   SHIFT+s     take snapshot
# ------------------------------------------------------------

v cycle sub; show-text "NJ Player: subtitle track"
b cycle audio; show-text "NJ Player: audio track"
a cycle-values video-aspect-override no 4:3 16:9 2.35:1; show-text "NJ Player: aspect ${video-aspect-override}"
n playlist-next; show-text "NJ Player: next"
p playlist-prev; show-text "NJ Player: previous"
t show-progress
g add sub-delay -0.5; show-text "NJ Player: sub delay ${sub-delay}s"
h add sub-delay 0.5; show-text "NJ Player: sub delay ${sub-delay}s"
SHIFT+s screenshot; show-text "NJ Player: snapshot saved"

# ------------------------------------------------------------
#  RIGHT-CLICK the video for the VLC-style menu
#  (playback, speed, A-B loop, audio/video/subtitles,
#   aspect ratio, snapshot, video adjustments, media info)
#  - handled by scripts/nj-menu.lua
# ------------------------------------------------------------

# Toggle debanding on/off
CTRL+d cycle deband; show-text "NJ Player: deband ${?deband:ON|OFF}"

# Toggle the sharpening shader on top of the current preset
CTRL+SHIFT+1 change-list glsl-shaders toggle "~~/shaders/adaptive-sharpen.glsl"; show-text "NJ Player: adaptive-sharpen toggled"

# Cycle hardware decoding (useful if video stutters)
CTRL+h cycle hwdec; show-text "NJ Player: hwdec ${hwdec}"
