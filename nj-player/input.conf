# ============================================================
#  NJ PLAYER — extra hotkeys
#  Preset keys (CTRL+0..3) and F9 cycling are defined in
#  scripts/nj-presets.lua
# ============================================================

# Toggle debanding on/off
CTRL+d cycle deband; show-text "NJ Player: deband ${?deband:ON|OFF}"

# Toggle the sharpening shader on top of the current preset
CTRL+SHIFT+1 change-list glsl-shaders toggle "~~/shaders/adaptive-sharpen.glsl"; show-text "NJ Player: adaptive-sharpen toggled"

# Cycle hardware decoding (useful if video stutters)
CTRL+h cycle hwdec; show-text "NJ Player: hwdec ${hwdec}"
