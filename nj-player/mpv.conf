# ============================================================
#  NJ PLAYER — core configuration
#  Offline desktop video player with "better Lucid Mode"
#  GPU-accelerated shaders · no AI · works with downloaded files
# ============================================================

# ------------------------------------------------------------
# Rendering & GPU
# ------------------------------------------------------------
# vo=gpu is the battle-tested renderer with full user-shader support.
# (vo=gpu-next is newer; user-shader support there is less mature.)
vo=gpu
gpu-api=d3d11

# Hardware decoding: plays high-res/low-bitrate files smoothly,
# keeps CPU usage low. CTRL+h cycles it at runtime.
hwdec=auto-safe

# ------------------------------------------------------------
# Scaling quality (high quality upscalers for low-res video)
# ------------------------------------------------------------
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
sigmoid-upscaling=yes
linear-downscaling=no
correct-downscaling=yes
# Anti-ringing for cleaner edges
scale-antiring=0.8
cscale-antiring=0.8
dscale-antiring=0.8

# Better color and contrast - Using VIDEO FILTERS
# These improve color depth and contrast without shaders
target-trc=gamma2.2
target-prim=bt.709
tone-mapping=hable
hdr-compute-peak=yes
tone-mapping-param=1.5

# VIDEO FILTERS for color enhancement - THIS IS THE RIGHT WAY
# eq filter: contrast:brightness:gamma:saturation
vf=eq=contrast=1.15:brightness=0.05:gamma=1.10:saturation=1.20

# ------------------------------------------------------------
# Debanding — removes color banding in dark scenes & gradients
# (part of every enhancement state)
# ------------------------------------------------------------
deband=yes
deband-iterations=3
deband-threshold=48
deband-range=16

# ------------------------------------------------------------
# Web links & live streams (YouTube, Twitch, m3u8, ...)
# Requires internet; needs yt-dlp.exe next to mpv (see install.ps1).
# ------------------------------------------------------------
# Prefer H.264/MP4 streams: hardware-decodes on almost any GPU.
# (AV1/VP9 often can't hardware-decode and can stutter.)
# To allow 4K+ or best quality, change to:  bestvideo+bestaudio/best
ytdl-format=bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best

# ------------------------------------------------------------
# Smooth playback
# ------------------------------------------------------------
video-sync=display-resample
interpolation=yes

# ------------------------------------------------------------
# Player behavior
# ------------------------------------------------------------
keep-open=yes                # stay open after the video ends
save-position-on-quit=yes    # resume where you left off (the "history")
# Resume positions stay inside this folder, not the system AppData,
# so NJ Player history is portable and easy to clear (GUI: Clear History)
watch-later-dir=~~/watch_later
# Write the filename into each watch-later entry so scripts can identify
# and remove the entry of one specific video (CTRL+BACKSPACE clears it).
write-filename-in-watch-later-config=yes
volume=100
volume-max=200               # allow loud sources to go louder
sub-auto=fuzzy               # auto-load subtitle files
sub-file-paths=subs

# ------------------------------------------------------------
# ON-SCREEN CONTROLS (VLC-style player controls)
# ------------------------------------------------------------
# Show OSC (On-Screen Controller) with play/pause, seek bar, volume
osc=yes
# Make the OSC bar larger and always visible on mouse movement
script-opts=osc-layout=bottombar,osc-seekbarstyle=bar,osc-deadzonesize=0.5,osc-minmousemove=3
# Show window border with title and standard Windows controls
border=yes
# Show playback stats on screen (optional - remove if you don't want it)
# osd-level=1
# Bigger OSD text for better visibility
osd-font-size=40
osd-color='#CCFFFFFF'
osd-border-color='#DD000000'
osd-border-size=2

# ============================================================
#  ENHANCEMENT PRESETS  (the "better Lucid Mode")
#  Activate with  CTRL+0..3  or cycle with  F9
#  Shaders are applied in the order listed.
# ============================================================

# CTRL+0 — enhancement off (clean playback)
[nj-clean]
glsl-shaders=

# CTRL+1 — Lucid: enhanced sharpening with better color
# Now includes KrigBilateral for better chroma quality
[nj-lucid]
glsl-shaders="~~/shaders/KrigBilateral.glsl"
glsl-shaders-append="~~/shaders/adaptive-sharpen.glsl"

# CTRL+2 — Cinema: full pipeline for low-res video
#   KrigBilateral  -> better color/chroma upsampling
#   FSRCNNX x2_16  -> high-quality upscale (the "AI-look" without AI)
#   SSimSuperRes   -> removes ringing, restores detail after upscale
#   adaptive-sharpen -> final smart edge enhancement
[nj-cinema]
glsl-shaders="~~/shaders/KrigBilateral.glsl"
glsl-shaders-append="~~/shaders/FSRCNNX_x2_16-0-4-1.glsl"
glsl-shaders-append="~~/shaders/SSimSuperRes.glsl"
glsl-shaders-append="~~/shaders/adaptive-sharpen.glsl"
# Better deband for cinema content
deband-iterations=5
deband-threshold=35
deband-range=20
deband-grain=64

# CTRL+3 — Anime: restores line art & removes compression artifacts
[nj-anime]
glsl-shaders="~~/shaders/Anime4K_Restore_CNN_Soft_M.glsl"
glsl-shaders-append="~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"

# NOTE: enhancement starts OFF so you get clean, unmodified playback.
# Press F9 to cycle presets or CTRL+1..3 to jump straight to one.
# (A top-level `profile=` line after these sections would be silently
# ignored by mpv, so the Lua script handles preset switching instead.)

